name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name for release (optional if triggered on existing tag)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Build and Publish Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Determine tag name
        id: vars
        env:
          INPUT_TAG: ${{ inputs.tag_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ -n "$INPUT_TAG" ]; then
            TAG="$INPUT_TAG"
          else
            TAG="$REF_NAME"
          fi
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9._-]+)?$ ]]; then
            echo "Error: Invalid tag format '$TAG'" >&2
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Package daemon directory
        run: |
          mkdir -p dist
          # Build .tar.gz containing daemon/ contents at the root of the archive
          tar --exclude='__pycache__' --exclude='*.pyc' --exclude='.DS_Store' -czf dist/bug-fixer-daemon.tar.gz -C daemon .
          # Build .zip containing daemon/ contents at the root of the archive
          (cd daemon && zip -r ../dist/bug-fixer-daemon.zip . -x "*__pycache__*" "*.pyc" "*.DS_Store")
          (cd dist && sha256sum bug-fixer-daemon.tar.gz bug-fixer-daemon.zip > SHA256SUMS)

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@c95fe1489396fe8a9eb87c0abf8aa5b2ef267fda # v2.2.1
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: ${{ steps.vars.outputs.tag }}
          files: |
            dist/bug-fixer-daemon.tar.gz
            dist/bug-fixer-daemon.zip
            dist/SHA256SUMS
          generate_release_notes: true
